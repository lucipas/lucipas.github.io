<!DOCTYPE html>
<html>
	<head>
		<title>Lucas Nguyen</title>
		<link rel="stylesheet" href="css/main.css" />
		<style>

* {scrollbar-color: transparent transparent;}
			body { margin: 0; background: #000; }
			#scrub {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
				z-index: 1;
			}
			#spacer { height: 500vh; position: relative; z-index: 0; }
			#smooth-wrapper { position: fixed; inset: 0; overflow: hidden; }
			#smooth-content { position: relative; }
		</style>
	</head>
	<body>
		<canvas id="scrub"></canvas>
		<div id="smooth-wrapper">
			<div id="smooth-content">
				<div id="spacer"></div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollSmoother.min.js"></script>
		<script src="js/scroll-anim.js"></script>
	</body>
</html>
